<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 282" role="img" aria-labelledby="t d">
<title id="t">A weighted draw's law is properly weighted for the target</title>
<desc id="d">Left, one weighted draw: the proposal's density as a shaded curve, and above it on the same horizontal axis the weight, density x, a curve that peaks to the right of the proposal's peak. A dashed line joins one value x on the proposal's axis to its weight on the curve. An arrow labeled reweight, then forget the weights, and Properly weighted, leads right to the target, a red curve with a shaded red area, whose height at each x is the weight times the proposal's height. Below it, the red area is the expected weight.</desc>
