name: Build source release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platforms:
    runs-on: ubuntu-latest
    outputs:
      os: ${{ steps.select.outputs.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - id: select
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          systems = json.loads(Path("release.json").read_text()).get("systems")
          hosts = [("x86_64-linux", "ubuntu-latest"), ("x86_64-darwin", "macos-15-intel")]
          runners = [runner for system, runner in hosts if systems is None or system in systems]
          if not runners:
              raise SystemExit("release has no supported CI host")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("os=" + json.dumps(runners) + "\n")
          PY

  build:
    needs: platforms
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.platforms.outputs.os) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: nix flake check
